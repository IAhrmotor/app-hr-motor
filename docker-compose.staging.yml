name: laravel-staging

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-staging-app
    working_dir: /var/www
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-staging-scheduler
    working_dir: /var/www
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-staging-queue-worker
    working_dir: /var/www
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=1", "--timeout=0"]
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: laravel-staging-nginx
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: laravel-staging-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - staging_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

volumes:
  staging_db_data:

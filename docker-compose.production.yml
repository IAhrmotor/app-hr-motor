name: laravel-production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-prod-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
      - ./docker/php-fpm/zz-production.conf:/usr/local/etc/php-fpm.d/zz-production.conf:ro
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-prod-scheduler
    working_dir: /var/www
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-prod-queue-worker
    working_dir: /var/www
    command: ["php", "artisan", "queue:work", "--queue=curriculum-analyses,google-business-profile-sync,default", "--sleep=1", "--tries=1", "--timeout=0"]
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  soketi:
    image: quay.io/soketi/soketi:latest
    container_name: laravel-prod-soketi
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"
      SOKETI_DEFAULT_APP_ENABLE_STATS: "false"
    ports:
      - "${SOKETI_FORWARD_PORT:-6001}:6001"

  nginx:
    image: nginx:stable-alpine
    container_name: laravel-prod-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - soketi

  db:
    image: mariadb:11
    container_name: laravel-prod-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - production_db_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

volumes:
  production_db_data:
